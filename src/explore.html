 out.innerHTML=html+(aiFn()?'<div class="ex-card"><p class="ex-st">AI กำลังหาความหมายและเพลงคล้าย…</p></div>':(k?"":'<div class="ex-card"><h4>ยังไม่รู้จักชื่อนี้ในเครื่อง</h4><p class="ex-p">ใส่ไฟล์เพลงให้ฟังจากเสียงจริงได้เลย หรือค้นต่อ:</p>'+songRow({title:q},"ค้นเพลงนี้")+'<p class="ex-note">ความหมายและเพลงคล้ายแบบละเอียดใช้ AI ได้ในลิงก์ claude.ai</p></div>'))+(AUDW?audBlock(AUDW):"");
 if(aiFn()){try{var j=await aiAsk(q);var kk=j&&KEYS.indexOf(j.key)>=0?j.key:k;out.innerHTML=aiCards(j)+(kk?genreCard({k:kk},null,k?"รู้จาก: "+a:"AI จัดแนว")+audBlock([{k:kk,w:1}]):"")}
  catch(e){out.insertAdjacentHTML("afterbegin",'<div class="ex-card"><p class="ex-st">AI ตอบไม่ได้ตอนนี้: '+esc(e&&(e.message||e.code)||e)+'</p></div>')}}
 BUSY=false;$("ex-go").disabled=false;try{localStorage.setItem("sns:exq",q)}catch(e){}}
async function analyseChs(chs,dur,label){var A=SNSGenre.analyse(chs),C=SNSGenre.classify(A,(label||"").toLowerCase()),top=C.list[0];
 var W=C.list.slice(0,4).map(function(x){return{k:x.g.k,w:x.share||x.s,pct:Math.max(1,Math.round((x.share||0)*100))}});
 $("ex-st").textContent="ฟังจากเสียงจริง "+Math.round(dur)+" วิ · BPM "+A.bpm+" · คีย์ "+A.key.name+" · ความดัง "+Math.round(A.lufs*10)/10+" LUFS";
 var html=genreCard({k:top.g.k,pct:top.pct},W,"วัดจาก BPM คีย์ เบส ความสว่าง"+(label?" + ชื่อไฟล์/เนื้อ":""))+audBlock(W);$("ex-out").innerHTML=html+(aiFn()?'<div class="ex-card"><p class="ex-st">AI กำลังหาเพลงคล้าย…</p></div>':"");
 if(aiFn()){try{var j=await aiAsk(label||"เพลงนี้",top.g.n+" · BPM "+A.bpm+" · คีย์ "+A.key.name);$("ex-out").innerHTML=aiCards(j)+html}catch(e){}}}
async function fromFile(){var f=this.files[0];this.value="";if(!f||!window.SNSGenre)return;var st=$("ex-st");st.textContent="กำลังฟังเพลง… (มือถือราว 10–30 วิ)";$("ex-out").innerHTML="";
 try{var d=await SNSGenre.decode(await f.arrayBuffer(),200);await new Promise(function(r){setTimeout(r,30)});await analyseChs(d.chs,d.dur,f.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," "))}catch(e){st.textContent="อ่านไฟล์นี้ไม่ได้: "+(e&&e.message||e)}}
async function fromProject(){var st=$("ex-st");st.textContent="กำลังฟังเพลงในโปรเจกต์…";$("ex-out").innerHTML="";
 try{var d=await SNSGenre.song();await new Promise(function(r){setTimeout(r,30)});var S={};try{S=SNSSong()}catch(e){}await analyseChs(d.chs,d.dur,(S.title||"")+" "+SNSGenre.text())}catch(e){st.textContent=/nosong/.test(e&&e.message)?"โปรเจกต์นี้ยังไม่มีไฟล์เพลง":"วิเคราะห์ไม่สำเร็จ: "+(e&&e.message||e)}}

/* ---------- ปล่อยเพลง: ใครปล่อย/เล่นช่วงเดียวกัน ---------- */
function radar(){var el=$("rl-radar");if(!el)return;var inp=$("rl-date"),v=inp&&inp.value,TL={intl:"อัลบั้มต่างประเทศ",th:"ไทย",ev:"อีเวนต์ในไทย"};
 var row=function(x,extra){return'<div class="ex-li"><div><strong>'+esc(x.a)+'</strong><span>'+esc((x.d?x.d.slice(8,10)+"/"+x.d.slice(5,7)+" · ":"")+TL[x.t]+" · "+x.w)+(extra||"")+'</span></div><a target="_blank" rel="noopener" href="'+D.yt(x.a+" "+x.w.replace(/^อัลบั้ม |^ซิงเกิล /,"").split(" — ")[0])+'">▶</a></div>'};
 var all=D.REL.items.map(function(x){return{d:x[0],t:x[1],a:x[2],w:x[3],big:!!x[4]}}),recentTh=all.filter(function(x){return x.t=="th"});
 var h='<div class="ex-card" style="margin-top:10px"><h4>ใครปล่อย/เล่นช่วงเดียวกัน</h4>';
 if(v){var C=D.clash(v),day=new Date(v+"T12:00:00").getDay(),big=C.filter(function(x){return x.big&&Math.abs(x.gap)<=2});
  h+=big.length?'<p class="ex-p" style="color:#ff8b97"><b>ชนกับงานใหญ่:</b> '+big.map(function(x){return esc(x.a)+" ("+(x.gap==0?"วันเดียวกัน":x.gap>0?"หลังคุณ "+x.gap+" วัน":"ก่อนคุณ "+(-x.gap)+" วัน")+")"}).join(", ")+' — คนฟัง/สื่อจะสนใจงานนั้นก่อน แนะนำเลื่อนไปอีก 1 สัปดาห์</p>':(C.length?'<p class="ex-p" style="color:#7ee2a0">ไม่ชนงานใหญ่ในช่วง ±2 วัน</p>':'<p class="ex-p" style="color:#7ee2a0">ยังไม่พบใครปล่อย/เล่นงานใหญ่ในช่วง ±7 วันจากข้อมูลที่มี</p>');
  h+=C.map(function(x){return row(x,x.gap==0?" · วันเดียวกัน":x.gap>0?" · หลังวันของคุณ "+x.gap+" วัน":" · ก่อนวันของคุณ "+(-x.gap)+" วัน")}).join("");
  if(day!=5)h+='<p class="ex-note">ทิป: เพลงทั่วโลกปล่อยวันศุกร์ (ชาร์ตนับรายสัปดาห์ศุกร์–พฤหัสฯ) วันที่เลือกเป็นวัน'+["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสฯ","ศุกร์","เสาร์"][day]+'</p>'}
 else{var now=Date.now(),soon=all.filter(function(x){if(!x.d)return false;var t=new Date(x.d+"T12:00:00").getTime();return t>now-2*864e5&&t<now+45*864e5}).sort(function(a,b){return a.d<b.d?-1:1});
  h+='<p class="ex-note" style="margin:0 0 4px">ใส่วันปล่อยด้านบน แอปจะเช็กว่าชนกับใคร</p>'+soon.map(function(x){return row(x)}).join("")}
 h+=(recentTh.length?'<p class="ex-p" style="margin-top:10px"><b>เพิ่งปล่อยในไทย (เข้าชาร์ตใหม่สัปดาห์นี้)</b></p>'+recentTh.map(function(x){return row(x)}).join(""):"")+
  '<p class="ex-note">ข้อมูล ณ '+esc(D.REL.at)+' จาก '+D.REL.src.map(esc).join(" · ")+' · ศิลปินไทยมักประกาศวันปล่อยล่วงหน้าไม่กี่วัน เช็กโซเชียลของศิลปินดังก่อนกดปล่อยอีกครั้ง</p></div>';
 el.innerHTML=h}
function radarWire(){var d=$("rl-date");if(d&&!d._rad){d._rad=1;d.addEventListener("change",radar);d.addEventListener("input",radar)}radar()}
function open(){var el=$("xpl");el.hidden=false;document.documentElement.style.overflow="hidden";var inProj=false;try{inProj=!!(window.SNS&&SNS.pid&&$("a")&&$("a").src)}catch(e){}$("ex-proj").hidden=!inProj||!window.SNSGenre;

if(document.readyState=="loading")document.addEventListener("DOMContentLoaded",wire);else wire();
window.SNSExplore={open:open,close:close,find:findArtist,run:fromProject,radar:radar};
})();
