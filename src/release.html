<style>
.rx-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0}
.rx-card h4{margin:0 0 4px;font-size:15.5px}
.rx-note{font-size:12px;color:var(--mut);line-height:1.6;margin:4px 0 8px}
.rx-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.rx-grid{grid-template-columns:1fr}}
.rx-f{display:block}.rx-f span{display:block;font-size:11.5px;color:var(--mut);margin:0 0 3px}
.rx-f input,.rx-f select,.rx-f textarea{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);padding:9px 10px;font:14px/1.4 inherit;font-family:inherit}
.rx-f textarea{min-height:90px;resize:vertical}
.rx-ck{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
.rx-ck:first-child{border-top:0}
.rx-ck b{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.rx-ck b.y{background:rgba(111,224,160,.18);color:#7ee2a0}.rx-ck b.n{background:rgba(255,51,71,.18);color:#ff8b97}.rx-ck b.w{background:rgba(255,196,107,.18);color:#ffc46b}
.rx-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rx-acts button,.rx-acts a{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:600 13px inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.rx-acts .pri{background:var(--red,#ff3347);border-color:var(--red,#ff3347);color:#fff}
.rx-cd{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}.rx-cd b{font:400 40px/1 Anton,system-ui;color:var(--red,#ff3347)}
.rx-tl{position:relative;margin:8px 0 0;padding-left:18px}
.rx-tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.rx-ev{position:relative;padding:7px 0 9px}
.rx-ev:before{content:"";position:absolute;left:-16px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--mut)}
.rx-ev.today:before{background:var(--red,#ff3347);box-shadow:0 0 0 4px rgba(255,51,71,.25)}
.rx-ev.done{opacity:.55}.rx-ev.done:before{background:#7ee2a0}
.rx-ev label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.rx-ev input{margin-top:3px;accent-color:#ff3347}
.rx-ev em{font-style:normal;font-size:11.5px;color:var(--mut);display:block}
.rx-ev strong{font-size:13.5px}
.rx-ev small{display:block;font-size:12px;color:var(--mut);line-height:1.5}
.rx-day{font:700 11px system-ui;letter-spacing:.06em;color:#ff8b97}
</style>
<script>/* ===== Slope North Side · เตรียมส่งสตรีมครบชุด + ปฏิทินปล่อยเพลง & แผนคอนเทนต์ ===== */

 return'<label class="rx-f"><span>'+lab+'</span><input data-k="'+k+'" type="'+(type||"text")+'" value="'+esc(v)+'"></label>'}

 host.querySelectorAll("#rx-form [data-k]").forEach(function(e){e.addEventListener(e.tagName=="SELECT"||e.type=="checkbox"||e.type=="date"?"change":"input",save)});

 $("rx-dl").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([sheet()],{type:"text/plain"}));a.download=(F().title||"release").replace(/[\\/:*?"<>|]/g,"")+"-release-info.txt";document.body.appendChild(a);a.click();a.remove()};

 [-10,"ประกาศชื่อเพลง + ปก","โพสต์ปกจาก MV & ปก › ชุดภาพโปรโมท","cover"],[-7,"ทีเซอร์ 15 วิ (ท่อนฮุค)","ส่งออก › ฮุค 15 วิ · ลง Reels/TikTok/Shorts","teaser"],
 [-5,"เบื้องหลัง / ตอนอัด","คลิปสั้นตอนแต่ง/อัด ใช้ภาพสตอรี่ได้","bts"],[-3,"ลิงก์พรีเซฟ","ลิงก์ pre-save จากผู้จัดจำหน่าย ใส่ในโปรไฟล์","presave"],

 [1,"คลิปเบื้องหลัง / ขอบคุณคนฟัง","ตอบคอมเมนต์ · แชร์สตอรี่คนที่ฟัง","d1"],[3,"YouTube Shorts ท่อนเด่น","ส่งออก › YouTube Shorts (AI เลือกท่อน)","shorts"],

 var P=J(KP,{}),t0=new Date(f.date+"T00:00:00"),dd=days(f.date),TH=["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."];
