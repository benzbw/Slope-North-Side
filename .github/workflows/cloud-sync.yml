# Slope North Side · ซิงค์เนื้อบนคลาวด์ฟรี
# แอปในมือถือส่งงาน (เข้ารหัสแล้ว) มาที่ jobs/<id>.bin บนกิ่ง sync-jobs → ที่นี่แยกเสียงร้อง + จับเวลาทีละคำ
# → ผล (เข้ารหัสด้วยกุญแจของงานนั้น) ไปที่ results/<id>.bin  กุญแจลับเก็บใน cache ของกิ่งนี้เท่านั้น ไม่อยู่ใน repo
name: Cloud sync (lyrics)
on:
  push:
    branches: [sync-jobs]
    paths: ['jobs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloud-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: sync-jobs, path: jobs, fetch-depth: 1 }
      - uses: actions/checkout@v4
        with: { ref: main, path: code, fetch-depth: 1, sparse-checkout: "ci\nsrc/app\nsrc/fa" }
      - name: Restore private key
        id: key
        uses: actions/cache/restore@v4
        with: { path: ~/.sns-key, key: sns-sync-key-v1 }
      - name: Create key pair (first run only)
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.sns-key
          python3 - <<'PY'
          import os, base64
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          k = rsa.generate_private_key(public_exponent=65537, key_size=3072)
          d = os.path.expanduser("~/.sns-key")
          open(d + "/priv.pem", "wb").write(k.private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8, serialization.NoEncryption()))
          open(d + "/pub.b64", "w").write(base64.b64encode(k.public_key().public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)).decode())
          PY
          chmod 600 ~/.sns-key/priv.pem
      - name: Save private key
        if: steps.key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: ~/.sns-key, key: sns-sync-key-v1 }
      - name: Publish public key
        run: |
          mkdir -p jobs/key
          if ! cmp -s ~/.sns-key/pub.b64 jobs/key/pub.b64; then cp ~/.sns-key/pub.b64 jobs/key/pub.b64; echo CHANGED=1 >> $GITHUB_ENV; fi
      - name: Any jobs?
        id: q
        run: echo "n=$(ls jobs/jobs/*.bin 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.q.outputs.n != '0'
        with: { python-version: '3.11', cache: pip, cache-dependency-path: code/ci/cloud_sync.py }
      - name: Model cache
        if: steps.q.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: sns-models-v1
      - name: Install
        if: steps.q.outputs.n != '0'
        run: |
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet demucs soundfile av transformers uroman pythainlp numpy scipy cryptography
      - name: Sync
        if: steps.q.outputs.n != '0'
        env:
          SNS_CODE: code
          SNS_JOBS: jobs
        run: SNS_SYNC_KEY="$(cat ~/.sns-key/priv.pem)" python code/ci/cloud_sync.py
      - name: Save results
        run: |
          cd jobs
          find results -name '*.bin' -mmin +1440 -delete 2>/dev/null || true
          git config user.name "sns-cloud-sync"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "cloud sync results"
          for i in 1 2 3 4 5; do git push -q origin HEAD:sync-jobs && exit 0; git pull -q --rebase origin sync-jobs || true; sleep 3; done
          exit 1
