# GPT (Co-Developer) รีวิว PR แบบฟรี: gpt-oss-20b (โมเดลเปิดของ OpenAI) รันบนเครื่อง GitHub Actions — ติดป้าย ask-gpt เท่านั้น
# ไม่ใช้ API key ไม่มีค่าใช้จ่าย (GitHub Actions ฟรีสำหรับ repo Public) · ช้ากว่าบริการเสียเงิน ราว 5–15 นาทีต่อครั้ง
name: GPT review
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write
  concurrency:
  group: gpt-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.label.name == 'ask-gpt' || github.event.label.name == 'gpt:deep'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Daily cap (30 runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/gpt-review.yml/runs?created=>=$(date -u +%F)" --jq '.total_count' || echo 0)
          echo "runs today: $n"
          if [ "$n" -gt 30 ]; then echo "::error::เกินโควตาที่ตั้งไว้วันละ 30 ครั้ง"; exit 1; fi
      - name: Build review packet
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .gpt
          python3 ci/gpt_packet.py review > .gpt/prompt.txt
          echo "packet chars: $(wc -c < .gpt/prompt.txt)"
      - name: Start free GPT (gpt-oss-20b via Ollama on this runner)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_CONTEXT_LENGTH=12288 OLLAMA_KEEP_ALIVE=30m nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull gpt-oss:20b
          free -g; df -h / | tail -1
      - name: Ask GPT (free, on runner)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: gpt-oss:20b
        run: python3 ci/gpt_call.py .gpt/prompt.txt .gpt/response.md "$MODEL" 2000
      - name: Post review comment
        uses: actions/github-script@v7
        env:
          MODEL: gpt-oss:20b
        with:
          script: |
            const body = '### 🤖 GPT · Co-Developer review\n\n' + (require('fs').readFileSync('.gpt/response.md','utf8') || '(ไม่มีคำตอบ)') +
              '\n\n---\n<sub>โมเดล ' + process.env.MODEL + ' ผ่าน GitHub Models (ฟรี) · Claude (Lead) จะตรวจและตัดสินใจขั้นสุดท้าย · ติดป้าย ask-gpt อีกครั้งเพื่อรีวิวใหม่</sub>';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.payload.pull_request.number, body });
            try { await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.payload.pull_request.number, name: context.payload.label.name }); } catch (e) {}
