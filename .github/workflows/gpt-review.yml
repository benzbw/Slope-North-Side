# GPT (Co-Developer) รีวิว PR แบบฟรีผ่าน GitHub Models — ทำงานเมื่อติดป้าย ask-gpt หรือ gpt:deep เท่านั้น
# ไม่ใช้ OpenAI API key · ไม่มีค่าใช้จ่าย (ถ้าโควตาฟรีหมด GitHub จะตอบว่าเกินโควตา ไม่คิดเงิน ตราบใดที่ไม่ได้เปิด pay-as-you-go)
name: GPT review
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write
  models: read
concurrency:
  group: gpt-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.label.name == 'ask-gpt' || github.event.label.name == 'gpt:deep'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Daily cap (30 runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/gpt-review.yml/runs?created=>=$(date -u +%F)" --jq '.total_count' || echo 0)
          echo "runs today: $n"
          if [ "$n" -gt 30 ]; then echo "::error::เกินโควตาที่ตั้งไว้วันละ 30 ครั้ง"; exit 1; fi
      - name: Build review packet
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .gpt
          python3 ci/gpt_packet.py review > .gpt/prompt.txt
          echo "packet chars: $(wc -c < .gpt/prompt.txt)"
      - name: Ask GPT (GitHub Models, free tier)
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: ${{ github.event.label.name == 'gpt:deep' && 'openai/gpt-4.1' || 'openai/gpt-4.1-mini' }}
          prompt-file: .gpt/prompt.txt
          max-tokens: 2000
      - name: Post review comment
        uses: actions/github-script@v7
        env:
          RESP: ${{ steps.ai.outputs.response }}
          MODEL: ${{ github.event.label.name == 'gpt:deep' && 'openai/gpt-4.1' || 'openai/gpt-4.1-mini' }}
        with:
          script: |
            const body = '### 🤖 GPT · Co-Developer review\n\n' + (process.env.RESP || '(ไม่มีคำตอบ)') +
              '\n\n---\n<sub>โมเดล ' + process.env.MODEL + ' ผ่าน GitHub Models (ฟรี) · Claude (Lead) จะตรวจและตัดสินใจขั้นสุดท้าย · ติดป้าย ask-gpt อีกครั้งเพื่อรีวิวใหม่</sub>';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.payload.pull_request.number, body });
            try { await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.payload.pull_request.number, name: context.payload.label.name }); } catch (e) {}
